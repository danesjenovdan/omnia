apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnia-4xproti
  labels:
    app: omnia-4xproti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnia-4xproti
  template:
    metadata:
      labels:
        app: omnia-4xproti
    spec:
      containers:
        - name: omnia-4xproti
          image: omnia-4xproti
          ports:
            - containerPort: 80
