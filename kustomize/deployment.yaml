apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnia-voda
  labels:
    app: omnia-voda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnia-voda
  template:
    metadata:
      labels:
        app: omnia-voda
    spec:
      containers:
        - name: omnia-voda
          image: omnia-voda
          ports:
            - containerPort: 80
