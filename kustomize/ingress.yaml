apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: predcasno-glasovanje-dz-2022-add-trailing-slash
spec:
  redirectRegex:
    regex: (/zemljevid/predcasno-glasovanje)(\?.*)?$
    replacement: ${1}/${2}
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: predcasno-glasovanje-dz-2022-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /zemljevid/predcasno-glasovanje
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predcasno-glasovanje-dz-2022
  annotations:
    # Do not put cert manager here, root redirect ingress (in `ops` repo) will handle it.
    # If we put it here, they will both try to issue the certificate and letsencrypt will rate limit us.
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      vodici-redirect-domain@kubernetescrd,
      vodici-predcasno-glasovanje-dz-2022-add-trailing-slash@kubernetescrd,
      vodici-predcasno-glasovanje-dz-2022-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vodici.danesjenovdan.si
      http:
        paths:
          - path: /zemljevid/predcasno-glasovanje
            pathType: Prefix
            backend:
              service:
                name: predcasno-glasovanje-dz-2022
                port:
                  number: 80
